<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>💙 Private Page</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:white;
}

/* LOGIN SCREEN */
#loginScreen{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  z-index:999;
}

#loginScreen input{
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
  width:200px;
  text-align:center;
  font-size:16px;
}

#loginScreen button{
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

/* MAIN */
#main{
  display:none;
  width:100%;
  height:100%;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* background */
.circle{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  background:rgba(59,130,246,0.3);
  animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){left:10%;top:20%;}
.circle:nth-child(2){left:70%;top:30%;animation-delay:2s;}
.circle:nth-child(3){left:40%;top:70%;animation-delay:4s;}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-40px);}
}

/* card */
.card{
  position:relative;
  z-index:10;
  width:90%;
  max-width:420px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.card img{
  width:140px;
  animation:bounce 2s infinite;
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

.buttons{
  display:flex;
  gap:15px;
  width:100%;
  justify-content:center;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
}

#yes{background:#22c55e;color:white;}
#no{background:#ef4444;color:white;}

button:hover{transform:scale(1.05);}

#musicBtn{
  position:absolute;
  top:20px;
  right:20px;
  background:#3b82f6;
  color:white;
  z-index:20;
}

canvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

/* mobile */
@media(max-width:600px){
  .buttons{flex-direction:column;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>🔐 Giriş Yap</h2>
  <p>Devam etmek için şifreyi gir</p>
  <input type="password" id="pass" placeholder="Şifre">
  <button onclick="checkPass()">Giriş</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- MAIN -->
<div id="main">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<canvas id="confetti"></canvas>

<button id="musicBtn">🎵 Müziği Başlat</button>

<div class="card">
  <img src="stitch.png" alt="stitch">
  <h2>Sana bir şey söylemek istiyorum 💙</h2>
  <p>Bunu kabul eder misin?</p>

  <div class="buttons">
    <button id="yes">Evet 💙</button>
    <button id="no">Hayır</button>
  </div>
</div>

<audio id="music" src="music.mp3"></audio>

</div>

<script>

/* LOGIN CHECK */
function checkPass(){
  const val = document.getElementById("pass").value;

  if(val === "1907"){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("main").style.display="flex";
  }else{
    document.getElementById("error").innerText="❌ Hatalı şifre";
  }
}

/* MUSIC */
const music = document.getElementById("music");
document.getElementById("musicBtn").onclick = () => {
  music.play();
};

/* YES */
document.getElementById("yes").onclick = () => {
  music.play();
  startConfetti();
  alert("💙 Harika!");
};

/* NO */
document.getElementById("no").onclick = () => {
  alert("😢 tekrar düşün");
};

/* CONFETTI */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let pieces = [];

for(let i=0;i<180;i++){
  pieces.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*6+2,
    d: Math.random()*5+2,
    color:`hsl(${Math.random()*360},100%,50%)`
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  pieces.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,p.r,p.r);

    p.y += p.d;

    if(p.y > canvas.height){
      p.y = -10;
      p.x = Math.random()*canvas.width;
    }
  });

  requestAnimationFrame(draw);
}

function startConfetti(){
  draw();
}

/* resize */
window.addEventListener("resize",()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

</script>

</body>
</html>
